<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230F5A45'/%3E%3Cg transform='translate(18 16) scale(.64)'%3E%3Cpath fill='%23fff' fill-rule='evenodd' d='M50%205C29.6%205%2015%2020.4%2015%2040.2%2015%2065%2050%2095%2050%2095s35-30%2035-54.8C85%2020.4%2070.4%205%2050%205zM37.5%2061V43.5c0-9%205.6-15.6%2012.5-21%206.9%205.4%2012.5%2012%2012.5%2021V61z'/%3E%3Ccircle cx='50' cy='45' r='4.6' fill='%23E3B04B'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#0A3F31">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console — Kiblatku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

try{ if(!/[?&]preview=1/.test(location.search) && !localStorage.getItem('kiblatku_session') && !sessionStorage.getItem('kiblatku_session')) location.replace('login.html'); }catch(e){}
</script>
<style>
:root{--e9:#062F24;--e8:#0A3F31;--e7:#0F5A45;--e6:#12805F;--mint:#E6F4EE;--gold:#E3B04B;--goldD:#7A4E05;--goldS:#FCF3DF;--sky:#E6F0FB;--skyD:#1F5E9E;--vio:#EFEAFB;--vioD:#5B3FA8;--rose:#FBE9EC;--roseD:#A3324A;--red:#FBE9E6;--redD:#A33A28;--ink:#10201B;--mut:#56665F;--line:#E5EBE7;--bg:#F4F7F5;--card-sh:0 1px 2px rgba(15,50,40,.04),0 12px 30px -16px rgba(15,50,40,.14)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
button{cursor:pointer;transition:transform .12s ease,background-color .15s ease}
button:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:256px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px;gap:3px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 24px;text-decoration:none;color:var(--e8)}
.brand .mk{width:44px;height:44px;border-radius:14px;background:var(--e8);color:var(--gold);display:grid;place-items:center}
.brand{gap:10px}
.brand .wm{display:block;margin-bottom:3px}
.wm{font-weight:800;letter-spacing:-.04em;line-height:1;font-style:normal}

.brand small{font-size:11px;color:var(--mut);font-weight:600}
.grp{font-size:12px;font-weight:700;color:#7A8A84;padding:6px 12px 8px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border:0;border-radius:14px;font-size:14px;font-weight:600;text-align:left;background:transparent;color:#4B5B55}
.nav:hover{background:#F4F7F5}
.nav .i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#F1F4F2;color:var(--mut)}
.nav.on{background:var(--mint);color:var(--e8);font-weight:800}
.nav.on .i{background:var(--e7);color:#fff}
.nav .badge{margin-left:auto;font-size:11px;font-weight:800;background:var(--gold);color:#3D2803;padding:2px 8px;border-radius:99px}
.help{position:relative;overflow:hidden;margin-top:auto;border-radius:18px;background:var(--e8);color:#fff;padding:18px;display:flex;flex-direction:column;gap:8px}
.help b{font-size:14px}.help span{font-size:12px;color:#CFE3DA;line-height:1.5}
.help button{align-self:flex-start;border:0;background:var(--gold);color:#3D2803;padding:9px 14px;border-radius:10px;font-size:12px;font-weight:800}
.pat{position:absolute;inset:0;pointer-events:none}
.help>*:not(.pat){position:relative}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:18px 32px 10px;position:sticky;top:0;background:rgba(244,247,245,.92);backdrop-filter:blur(12px);z-index:10}
.top .ttl{flex:1;min-width:0}
.top h1{font-size:23px;margin:0;color:var(--e8);letter-spacing:-.4px}
.top .sub{font-size:13px;color:var(--mut)}
.search{display:flex;align-items:center;gap:8px;width:250px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 14px;height:44px;color:#7A8A84}
.search input{border:0;outline:0;font-size:13px;width:100%;background:transparent;color:var(--ink)}
.chip-demo{font-size:11px;font-weight:800;color:#8A5A0B;background:var(--goldS);padding:7px 11px;border-radius:99px;white-space:nowrap}
.ibtn{position:relative;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.ibtn .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:#D9483B;border:2px solid #fff}
.me{position:relative}
.me>button{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px 12px 5px 5px;text-align:left}
.av{width:34px;height:34px;border-radius:10px;background:var(--gold);color:#3D2803;display:grid;place-items:center;font-weight:800;font-size:13px}
.me b{font-size:13px;display:block}.me small{font-size:11px;color:var(--mut)}
.drop{position:absolute;right:0;top:calc(100% + 8px);width:230px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 40px -16px rgba(6,47,36,.3);padding:8px;display:none;z-index:30}
.drop.open{display:block}
.drop .em{padding:10px 12px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);margin-bottom:6px;word-break:break-all}
.drop a,.drop button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;background:transparent;border-radius:10px;font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;text-align:left}
.drop a:hover,.drop button:hover{background:#F4F7F5}
.drop .out{color:var(--redD)}
.menu-btn{display:none}
.content{padding:6px 32px 40px;display:flex;flex-direction:column;gap:20px}
/* blocks */
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px 24px;box-shadow:var(--card-sh)}
.card h3{font-size:16px;margin:0}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.span2{grid-column:span 2}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hd small{display:block;font-size:12px;color:var(--mut)}
.dark{background:var(--e8);color:#fff;border-radius:20px;padding:20px;position:relative;overflow:hidden}
.dark .l{color:#CFE3DA;font-size:13px;font-weight:600}
.kpi{display:flex;flex-direction:column;gap:12px}
.kpi .row{display:flex;justify-content:space-between;align-items:center}
.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.pill{font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px}
.kpi .l{font-size:13px;color:var(--mut);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.5px}
.banner{position:relative;overflow:hidden;border-radius:24px;background:var(--e8);color:#fff;padding:28px 30px;display:flex;align-items:center;gap:20px;min-height:160px}
.banner .glow{position:absolute;right:-60px;top:-80px;width:300px;height:300px;border-radius:50%;background:var(--e6);opacity:.35}
.banner .sky{position:absolute;right:0;bottom:0;width:420px;height:auto}
.banner .txt{position:relative;flex:1;display:flex;flex-direction:column;gap:8px;max-width:620px}
.banner .d{font-size:13px;color:#CFE3DA;font-weight:600}
.banner h2{font-size:26px;margin:0;letter-spacing:-.5px}
.banner p{margin:0;color:#CFE3DA;font-size:14px}
.banner .acts{display:flex;gap:10px;padding-top:8px;flex-wrap:wrap}
.nx{position:relative;margin-left:auto;margin-right:240px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:16px 20px;min-width:160px}
.nx small{font-size:12px;color:#CFE3DA;font-weight:600}.nx b{display:block;font-size:28px}.nx span{font-size:14px;font-weight:700;color:#F1CF85;font-variant-numeric:tabular-nums}
.b-gold{border:0;background:var(--gold);color:#3D2803;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:800}
.b-ghost{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:700}
.b-pri{border:0;background:var(--e7);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:800}
.b-pri:hover{background:var(--e8)}
.b-sec{border:1px solid #DCE3DF;background:#fff;color:var(--e7);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:800}
.b-soft{border:0;background:#F1F4F2;color:var(--e7);padding:8px 12px;border-radius:10px;font-size:12px;font-weight:800}
.seg{display:flex;background:#F1F4F2;border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:800;background:transparent;color:var(--mut)}
.seg button.on{background:#fff;color:var(--e8);box-shadow:0 1px 3px rgba(15,50,40,.15)}
.seg button span{opacity:.7}
.chart{position:relative;width:100%;height:200px}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart .pt{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;border:3px solid}
.chart .lb{position:absolute;transform:translate(-50%,-34px);font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px;white-space:nowrap;color:var(--mut)}
.months{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-weight:600;padding-top:8px}
.donut{position:relative;width:150px;height:150px;margin:6px auto 16px}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.leg{display:flex;align-items:center;gap:10px;font-size:13px;margin-top:10px}
.leg i{width:10px;height:10px;border-radius:3px}.leg span{flex:1;font-weight:600}
.list-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid #F0F3F1;font-size:14px}
.list-row .av2{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0}
.list-row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.list-row small{font-size:12px;color:var(--mut)}
.amt{font-weight:800;white-space:nowrap}
.pr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-size:14px}
.pr i{width:8px;height:8px;border-radius:50%}.pr span{flex:1;font-weight:700}.pr b{font-variant-numeric:tabular-nums}
.pr.on{background:var(--e7);color:#fff}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{font-size:12px;font-weight:800;color:var(--mut);text-align:left;padding:11px 14px;background:#F6F8F7}
.table th:first-child{border-radius:12px 0 0 12px}.table th:last-child{border-radius:0 12px 12px 0}
.table td{padding:12px 14px;border-bottom:1px solid #F0F3F1;vertical-align:middle}
.table .r{text-align:right}
.tscroll{overflow-x:auto}
.who{display:flex;align-items:center;gap:12px;font-weight:700}
.who i{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:800;font-style:normal}
.fld{display:flex;flex-direction:column;gap:7px}
.fld label{font-size:12px;font-weight:700;color:#3A4A44}
.fld input{padding:12px 14px;border:1px solid #DCE3DF;border-radius:12px;font-size:14px;color:var(--ink);background:#FAFCFB;outline:0}
.fld input:focus{border-color:var(--e6);box-shadow:0 0 0 4px rgba(18,128,95,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{padding:7px 12px;border-radius:99px;background:var(--mint);color:var(--e8);font-size:12px;font-weight:700}
.cover{position:relative;overflow:hidden;border-radius:24px;background:var(--e8);height:170px;color:#fff}
.cover .sky{position:absolute;right:30px;bottom:0;width:520px;height:auto}
.cover .in{position:absolute;left:30px;bottom:26px;display:flex;align-items:center;gap:18px}
.cover .lg{width:76px;height:76px;border-radius:22px;background:var(--gold);color:var(--e8);display:grid;place-items:center;border:4px solid rgba(255,255,255,.25)}
.ev{display:flex;gap:16px}
.cal{width:70px;height:76px;flex-shrink:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cal b{font-size:24px;line-height:1}.cal span{font-size:12px;font-weight:800}
.box{padding:14px;border-radius:16px;border:1px solid var(--line);background:#FAFCFB;display:flex;flex-direction:column;gap:6px}
.box .acts{display:flex;gap:8px;padding-top:4px}
.box .acts button{flex:1;padding:9px;border-radius:10px;font-size:12px;font-weight:800}
.status{align-self:flex-start;font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px}
.bar{height:14px;background:#EEF2EF;border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--e6);border-radius:99px}
.note{display:flex;align-items:center;gap:12px;background:var(--goldS);color:#5E3D05;border-radius:16px;padding:14px 18px;font-size:13px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(6,30,23,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal.open{display:flex}
.modal .dlg{width:100%;max-width:480px;background:#fff;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);opacity:0;display:flex;align-items:center;gap:10px;background:var(--e8);color:#fff;padding:13px 18px 13px 14px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 16px 36px -10px rgba(6,47,36,.5);transition:.22s;pointer-events:none;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast i{width:24px;height:24px;flex-shrink:0;border-radius:50%;background:var(--gold);color:var(--e8);display:grid;place-items:center}
.scrim{display:none}
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nx{margin-right:0}
  .banner .sky{opacity:.4}
  .search{display:none}
}
@media (max-width:1020px){
  .side{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .2s ease;box-shadow:20px 0 40px -20px rgba(0,0,0,.3)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(6,30,23,.4);z-index:45}
  .menu-btn{display:grid}
  .g3,.g2{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .top{padding:14px 18px 10px}
  .content{padding:6px 18px 32px}
  .chip-demo,.me .nm{display:none}
}
@media (max-width:560px){
  .g4{grid-template-columns:1fr}
  .banner{flex-direction:column;align-items:flex-start}
  .nx{margin-left:0}
  .top h1{font-size:19px}
  .cover .sky{width:300px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side" aria-label="Menu utama">
<a class="brand" href="index.html" aria-label="Kiblatku, beranda"><svg class="logo-mk" width="42" height="42" viewBox="0 0 100 100" aria-hidden="true"><path fill="#0A3F31" fill-rule="evenodd" d="M50 5C29.6 5 15 20.4 15 40.2 15 65 50 95 50 95s35-30 35-54.8C85 20.4 70.4 5 50 5zM37.5 61V43.5c0-9 5.6-15.6 12.5-21 6.9 5.4 12.5 12 12.5 21V61z"/><circle cx="50" cy="45" r="4.6" fill="#B07D1E"/></svg><span><b class="wm" style="color:#0A3F31;font-size:22px">kiblat<span style="color:#B07D1E">ku</span></b><small>Console Masjid</small></span></a>
<div class="grp">Menu masjid</div>
<button class="nav" data-page="dashboard"><span class="i" data-i="grid:18"></span>Dasbor</button>
<button class="nav" data-page="profil"><span class="i" data-i="mosque:18"></span>Profil Masjid</button>
<button class="nav" data-page="donasi"><span class="i" data-i="heart:18"></span>Donasi</button>
<button class="nav" data-page="keuangan"><span class="i" data-i="wallet:18"></span>Keuangan</button>
<button class="nav" data-page="event"><span class="i" data-i="cal:18"></span>Kegiatan<span class="badge" id="evBadge">4</span></button>
<button class="nav" data-page="inventaris"><span class="i" data-i="box:18"></span>Inventaris &amp; Fasilitas</button>
<div class="grp" style="padding-top:18px">Pemerintah</div>
<button class="nav" data-page="kementerian"><span class="i" data-i="shield:18"></span>Panel Kementerian</button>
<div class="help" style="margin-top:24px">
<svg class="pat" aria-hidden="true" width="100%" height="100%"><defs><pattern id="geo" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M20 3l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="1.2"/></pattern><pattern id="geoL" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M24 4l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="1.2"/><rect x="15" y="15" width="18" height="18" transform="rotate(45 24 24)" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern></defs><rect width="100%" height="100%" fill="url(#geo)"/></svg>
<b>Butuh bantuan?</b><span>Tim Kiblatku siap mendampingi digitalisasi masjid Anda.</span>
<button data-act="help">Hubungi tim</button>
</div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="main">
<header class="top">
<button class="ibtn menu-btn" id="menuBtn" aria-label="Buka menu" data-i="menu:20"></button>
<div class="ttl"><h1 id="pageTitle">Dasbor</h1><div class="sub"><span id="mName">Masjid Al-Ikhlas</span>, Tangerang Selatan</div></div>
<label class="search"><span data-i="search:18"></span><span style="position:absolute;left:-9999px">Cari</span><input placeholder="Cari donatur, kegiatan…"></label>
<span class="chip-demo">Data contoh</span>
<button class="ibtn" aria-label="Notifikasi" data-act="bell"><span data-i="bell:20"></span><span class="dot"></span></button>
<div class="me">
<button id="meBtn" aria-haspopup="true" aria-expanded="false"><span class="av" id="av">AD</span><span class="nm"><b>Admin DKM</b><small>Bendahara</small></span></button>
<div class="drop" id="drop" role="menu">
<div class="em" id="meEmail">admin@masjid.id</div>
<a href="app.html" role="menuitem"><span data-i="phone:18"></span>Buka aplikasi jamaah</a>
<a href="index.html" role="menuitem"><span data-i="home:18"></span>Ke halaman utama</a>
<button class="out" data-act="logout" role="menuitem"><span data-i="logout:18"></span>Keluar</button>
</div>
</div>
</header>
<main class="content" id="content"></main>
</div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
<div class="dlg">
<div style="display:flex;align-items:center;gap:12px"><span class="ico" style="background:var(--vio);color:var(--vioD)" data-i="cal:22"></span><div><div id="mTitle" style="font-size:19px;font-weight:800;color:var(--e8)">Kegiatan baru</div><div style="font-size:12px;color:var(--mut)">Akan dikirim sebagai notifikasi ke jamaah pengikut</div></div></div>
<div class="fld"><label for="evName">Nama kegiatan</label><input id="evName" placeholder="mis. Kajian Subuh Ahad"></div>
<div class="g2" style="gap:12px">
<div class="fld"><label for="evDate">Tanggal</label><input id="evDate" type="date"></div>
<div class="fld"><label for="evTime">Waktu</label><input id="evTime" type="time" value="05:00"></div>
</div>
<div class="fld"><label for="evPlace">Tempat</label><input id="evPlace" value="Ruang Utama"></div>

 S.events.map(function(e,i){var c=ET[e.cat]||ET.Baru;return card('<div class="ev"><div class="cal" style="background:'+c[0]+';color:'+c[1]+'"><b>'+e.day+'</b><span>'+e.mon+'</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="display:flex;gap:8px;align-items:center"><span class="pill" style="background:'+c[0]+';color:'+c[1]+'">'+e.cat+'</span><small style="color:var(--mut);font-weight:600">'+e.reg+' pendaftar</small></div><b style="font-size:16px">'+esc(e.title)+'</b><span style="font-size:13px;color:var(--mut)">'+esc(e.date)+', '+esc(e.place)+'</span><div style="display:flex;gap:8px;padding-top:4px"><button class="b-soft" data-act="toast" data-v="Kode QR check-in siap dicetak">QR check-in</button><button class="b-soft" data-act="toast" data-v="Notifikasi terkirim ke 1.240 jamaah pengikut">Kirim notifikasi</button></div></div></div>','','padding:18px');}).join('')+'</div>';
},

 var IS={Baik:['var(--mint)','#0A5A42'],'Perlu servis':['var(--goldS)','var(--goldD)'],'Sebagian rusak':['var(--red)','var(--redD)']};
 var IV=[['Karpet sajadah roll','Perlengkapan ibadah','24 roll','Baik'],['Sound system utama','Elektronik','1 set','Perlu servis'],["Mushaf Al-Qur'an",'Perlengkapan ibadah','180 buah','Baik'],['Kipas angin dinding','Elektronik','16 unit','Baik'],['Kursi lipat','Perabot','120 buah','Baik'],['Mukena','Perlengkapan ibadah','40 buah','Sebagian rusak']];
 var BK=[['b1','Aula Serbaguna','Keluarga Hendra, akad nikah','4 Okt, 09:00–12:00'],['b2','Ambulans masjid','Warga RT 05, antar ke rumah sakit','26 Sep, 07:00'],['b3','Ruang TPA','Remaja masjid, rapat bulanan','26 Sep, 16:00']];
 return '<div class="g3">'+card('<h3 style="margin-bottom:14px">Inventaris</h3><div class="tscroll"><table class="table"><thead><tr><th>Barang</th><th>Kategori</th><th>Jumlah</th><th>Kondisi</th></tr></thead><tbody>'+IV.map(function(r){var c=IS[r[3]];return '<tr><td style="font-weight:700">'+r[0]+'</td><td style="color:var(--mut)">'+r[1]+'</td><td>'+r[2]+'</td><td><span class="pill" style="background:'+c[0]+';color:'+c[1]+';display:inline-flex;gap:6px;align-items:center"><i style="width:6px;height:6px;border-radius:50%;background:currentColor"></i>'+r[3]+'</span></td></tr>';}).join('')+'</tbody></table></div>','span2')+
 card('<h3 style="margin-bottom:14px">Permintaan fasilitas</h3><div style="display:flex;flex-direction:column;gap:12px">'+BK.map(function(b){var st=S.bookings[b[0]];return '<div class="box"><b>'+b[1]+'</b><small style="color:var(--mut)">'+b[2]+'</small><small style="font-weight:700">'+b[3]+'</small>'+(st?'<span class="status" style="background:'+(st==='ok'?'var(--mint)':'var(--red)')+';color:'+(st==='ok'?'#0A5A42':'var(--redD)')+'">'+(st==='ok'?'Disetujui, pemohon diberi tahu':'Ditolak')+'</span>':'<div class="acts"><button class="b-pri" data-act="book" data-id="'+b[0]+'" data-v="ok" data-n="'+b[1]+'">Setujui</button><button class="b-sec" style="color:#3A4A44" data-act="book" data-id="'+b[0]+'" data-v="no" data-n="'+b[1]+'">Tolak</button></div>')+'</div>';}).join('')+'</div>')+'</div>';
},
kementerian:function(){
 var QU=[['q1','Masjid Nurul Huda','Serpong, Tangerang Selatan','diajukan 23 Sep'],['q2','Masjid Baitul Rahman','Cibinong, Bogor','diajukan 22 Sep'],['q3','Musala Al-Hidayah','Cempaka Putih, Jakarta Pusat','diajukan 21 Sep']];
 var dec=Object.keys(S.queue).length,ok=Object.keys(S.queue).filter(function(k){return S.queue[k]==='ok';}).length;
 var PV=[['Jawa Barat',4310,68],['Jawa Tengah',2250,74],['Banten',2140,82],['DKI Jakarta',1985,91],['Jawa Timur',1795,63]];
 return '<div class="note">'+ic('info',20)+'Tampilan untuk pengguna tingkat kementerian/Kanwil: memantau Satu Data Masjid Indonesia (SDMI) lintas wilayah.</div>'+
 '<div class="g4"><div class="dark"><div class="l">Masjid terdaftar</div><div style="font-size:26px;font-weight:800">12.480</div></div>'+card('<div class="kpi"><div class="l">Terverifikasi</div><div class="v">'+(9315+ok).toLocaleString('id-ID')+'</div></div>','','padding:20px')+card('<div class="kpi"><div class="l">Menunggu verifikasi</div><div class="v" style="color:#8A5A0B">'+(1206-dec).toLocaleString('id-ID')+'</div></div>','','padding:20px')+card('<div class="kpi"><div class="l">Provinsi aktif</div><div class="v">14</div></div>','','padding:20px')+'</div>'+
 '<div class="g3">'+card('<h3 style="margin-bottom:18px">Cakupan verifikasi per provinsi</h3><div style="display:flex;flex-direction:column;gap:16px">'+PV.map(function(p){return '<div style="display:flex;align-items:center;gap:14px;font-size:14px;flex-wrap:wrap"><b style="width:120px">'+p[0]+'</b><span style="width:100px;color:var(--mut);font-size:13px">'+p[1].toLocaleString('id-ID')+' masjid</span><span class="bar" style="min-width:120px"><i style="width:'+p[2]+'%"></i></span><b style="width:40px;text-align:right">'+p[2]+'%</b></div>';}).join('')+'</div>','span2')+
 card('<h3 style="margin-bottom:14px">Antrean verifikasi</h3><div style="display:flex;flex-direction:column;gap:12px">'+QU.map(function(q){var st=S.queue[q[0]];return '<div class="box"><b>'+q[1]+'</b><small style="color:var(--mut)">'+q[2]+', '+q[3]+'</small>'+(st?'<span class="status" style="background:'+(st==='ok'?'var(--mint)':'var(--goldS)')+';color:'+(st==='ok'?'#0A5A42':'var(--goldD)')+'">'+(st==='ok'?'Terverifikasi, masuk SDMI':'Dikembalikan untuk revisi')+'</span>':'<div class="acts"><button class="b-pri" data-act="verify" data-id="'+q[0]+'" data-v="ok" data-n="'+q[1]+'">Verifikasi</button><button class="b-sec" style="color:#3A4A44" data-act="verify" data-id="'+q[0]+'" data-v="no" data-n="'+q[1]+'">Minta revisi</button></div>')+'</div>';}).join('')+'</div>')+'</div>';
}
};

var content=document.getElementById('content');
function render(){
 document.querySelectorAll('.nav').forEach(function(b){var on=b.getAttribute('data-page')===S.page;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 document.getElementById('pageTitle').textContent=TITLES[S.page];
 document.title=TITLES[S.page]+' — Console Kiblatku';
 document.getElementById('evBadge').textContent=S.events.length;
 content.innerHTML=pages[S.page]();
 tick();
}
function go(p){S.page=p;history.replaceState(null,'','#'+p);closeSide();render();content.scrollTop=0;window.scrollTo(0,0);}
var toastEl=document.getElementById('toast'),tt;
function toast(s){document.getElementById('toastT').textContent=s;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove('show');},2600);}
function pad(n){return String(n).padStart(2,'0');}
function tick(){var el=document.querySelector('[data-cd]');if(!el)return;var np=nextPrayer(),n=nowSec(),t=sec(np[1]);if(t<=n)t+=86400;var d=t-n;el.textContent=pad(Math.floor(d/3600))+':'+pad(Math.floor(d%3600/60))+':'+pad(d%60);}
setInterval(tick,1000);

var side=document.getElementById('side'),scrim=document.getElementById('scrim');
function closeSide(){side.classList.remove('open');scrim.classList.remove('open');}
document.getElementById('menuBtn').addEventListener('click',function(){side.classList.add('open');scrim.classList.add('open');});
scrim.addEventListener('click',closeSide);
var meBtn=document.getElementById('meBtn'),drop=document.getElementById('drop');
meBtn.addEventListener('click',function(e){e.stopPropagation();var o=drop.classList.toggle('open');meBtn.setAttribute('aria-expanded',o);});
document.addEventListener('click',function(e){if(!drop.contains(e.target)&&e.target!==meBtn){drop.classList.remove('open');meBtn.setAttribute('aria-expanded','false');}});

var modal=document.getElementById('modal');
function openModal(){modal.classList.add('open');var d=new Date();document.getElementById('evDate').value=d.toISOString().slice(0,10);setTimeout(function(){document.getElementById('evName').focus();},30);}
function closeModal(){modal.classList.remove('open');}
modal.addEventListener('click',function(e){if(e.target===modal)closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();closeSide();drop.classList.remove('open');}});

var ACTS={
 help:function(){toast('Permintaan bantuan terkirim. Tim Kiblatku akan menghubungi Anda.');},
 bell:function(){toast('3 notifikasi baru: permintaan fasilitas dan donasi masuk');},
 logout:function(){try{localStorage.removeItem('kiblatku_session');sessionStorage.removeItem('kiblatku_session');}catch(e){}location.href='login.html';},
 series:function(b){S.series=b.dataset.v;render();},
 filter:function(b){S.filter=b.dataset.v;render();},
 toast:function(b){toast(b.dataset.v);},
 upload:function(){toast('Pilih foto dari komputer (simulasi)');},
 saveProfile:function(){toast('Profil tersimpan dan langsung tampil di aplikasi jamaah');},
 resetProfile:function(){S.profile={nama:'Masjid Al-Ikhlas',alamat:'Jl. Contoh Raya No. 12, Pondok Aren',ketua:'H. [Nama Ketua DKM]',tahun:'1998',kapasitas:'800 jamaah',telp:'0812-0000-0000'};document.getElementById('mName').textContent=S.profile.nama;render();},
 openModal:openModal, closeModal:closeModal,
 saveEvent:function(){
  var n=document.getElementById('evName').value.trim();
  if(!n){toast('Isi nama kegiatan terlebih dahulu');document.getElementById('evName').focus();return;}
  var dv=document.getElementById('evDate').value,tm=document.getElementById('evTime').value,d=dv?new Date(dv+'T00:00'):null;
  var mons=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  S.events.unshift({title:n,date:(d?d.toLocaleDateString('id-ID',{weekday:'long'}):'Tanggal belum diatur')+(tm?', '+tm:''),day:d?pad(d.getDate()):'–',mon:d?mons[d.getMonth()]:'Baru',place:document.getElementById('evPlace').value.trim()||'Masjid',reg:0,cat:'Baru'});
  document.getElementById('evName').value='';closeModal();go('event');toast('Kegiatan dipublikasikan ke aplikasi jamaah');
 },
 book:function(b){S.bookings[b.dataset.id]=b.dataset.v;render();toast('Permintaan '+b.dataset.n+(b.dataset.v==='ok'?' disetujui':' ditolak'));},
 verify:function(b){S.queue[b.dataset.id]=b.dataset.v;render();toast(b.dataset.v==='ok'?b.dataset.n+' terverifikasi dan masuk SDMI':'Permintaan revisi dikirim ke '+b.dataset.n);}
};
document.addEventListener('click',function(e){
 var p=e.target.closest('[data-page]');if(p){go(p.getAttribute('data-page'));return;}
 var a=e.target.closest('[data-act]');if(a&&ACTS[a.dataset.act]){ACTS[a.dataset.act](a);}
});
content.addEventListener('input',function(e){var k=e.target.getAttribute('data-prof');if(!k)return;S.profile[k]=e.target.value;if(k==='nama'){var v=e.target.value||'Masjid';document.getElementById('mName').textContent=v;var b=content.querySelector('[data-bind="nama"]');if(b)b.textContent=v;}});
window.addEventListener('hashchange',function(){var p=location.hash.slice(1);if(TITLES[p]&&p!==S.page){S.page=p;render();}});
render();
})();
</script>
</body>
