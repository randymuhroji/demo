<title>Kiblatku — Aplikasi Jamaah</title>
<meta name="description" content="Jadwal salat, kiblat, tasbih, Al-Qur'an, kajian, dan donasi masjid dalam satu aplikasi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--e9:#062F24;--e8:#0A3F31;--e7:#0F5A45;--e6:#12805F;--mint:#E6F4EE;--gold:#E3B04B;--goldD:#8A5A0B;--goldS:#FCF3DF;--sky:#E6F0FB;--skyD:#1F5E9E;--vio:#EFEAFB;--vioD:#5B3FA8;--teal:#E2F4F4;--tealD:#146B6B;--rose:#FBE9EC;--roseD:#A3324A;--ink:#10201B;--mut:#56665F;--line:#E5EBE7;--bg:#F4F7F5;--sh:0 12px 28px -20px rgba(6,47,36,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:#E9EEEA;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
button{cursor:pointer;transition:transform .12s ease,background-color .15s ease;color:inherit}
button:active{transform:scale(.96)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ar{font-family:'Amiri',serif;direction:rtl}
.sr{position:absolute;left:-9999px}
/* shell */
.shell{min-height:100%;display:flex;align-items:center;justify-content:center;gap:70px;padding:30px}
.intro{max-width:340px}
.intro .brand{display:flex;align-items:center;gap:12px;color:var(--e8);text-decoration:none;margin-bottom:26px}
.intro .brand i{width:44px;height:44px;border-radius:14px;background:var(--e8);color:var(--gold);display:grid;place-items:center}
.intro .brand{gap:10px}
.wm{font-weight:800;letter-spacing:-.04em;line-height:1;font-style:normal}
.splash{position:absolute;inset:0;z-index:40;background:var(--e8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;overflow:hidden;transition:opacity .45s ease,visibility .45s}
.splash.hide{opacity:0;visibility:hidden}
.splash .tg{position:absolute;bottom:calc(110px + env(safe-area-inset-bottom,0px));font-size:12px;font-weight:600;color:#CFE3DA}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.splash .logo-mk{animation:pop .5s ease both}
@media (prefers-reduced-motion:reduce){.splash .logo-mk{animation:none}}
.intro h1{font-size:34px;line-height:1.1;letter-spacing:-1px;margin:0 0 14px;color:var(--e8)}
.intro p{color:var(--mut);margin:0 0 22px;line-height:1.6}
.intro .lnk{display:flex;gap:8px;margin-bottom:14px}
.intro input{flex:1;min-width:0;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:13px;font-weight:600;background:#fff;color:var(--ink)}
.intro .cp{height:46px;border:0;border-radius:12px;padding:0 16px;background:var(--e7);color:#fff;font-weight:800}
.intro a.back{color:var(--e7);font-weight:700;text-decoration:none;font-size:14px}
.intro a.back:hover{text-decoration:underline}
.device{width:414px;height:868px;border-radius:52px;background:#0B1512;padding:12px;box-shadow:0 60px 90px -40px rgba(6,47,36,.55);flex-shrink:0}
.screen{position:relative;width:390px;height:844px;border-radius:40px;overflow:hidden;background:var(--bg)}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@media (max-width:900px){.intro{display:none}}
@media (max-width:600px),(max-height:700px) and (max-width:900px){
  body{background:var(--bg)}
  .shell{padding:0;display:block;min-height:100%}
  .device{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  .screen{width:100%;height:100%;border-radius:0}
}
/* common */
.pad{padding:4px 16px 120px;display:flex;flex-direction:column;gap:14px}
.hdr{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 12px;background:rgba(244,247,245,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hdr h1{margin:0;font-size:26px;font-weight:800;color:var(--e8);letter-spacing:-.5px;line-height:1.15}
.hdr.sm h1{font-size:20px}
.hdr small{font-size:12px;color:var(--mut);font-weight:600}
.ib{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:14px;display:grid;place-items:center;color:var(--e8);box-shadow:0 4px 12px -6px rgba(15,50,40,.2);flex-shrink:0}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
.dark{position:relative;overflow:hidden;background:var(--e8);color:#fff;border-radius:24px}
.dark>*:not(.pat):not(.glow){position:relative}
.pat{position:absolute;inset:0;pointer-events:none}
.glow{position:absolute;border-radius:50%;background:var(--e6);opacity:.38;pointer-events:none}
.sec-t{font-size:17px;font-weight:800;letter-spacing:-.3px}
.btn{min-height:52px;border:0;border-radius:16px;font-size:16px;font-weight:800;width:100%}
.btn.gold{background:var(--gold);color:#3D2803;box-shadow:0 12px 24px -12px rgba(227,176,75,.9)}
.btn.green{background:var(--e7);color:#fff;box-shadow:0 12px 24px -12px rgba(15,90,69,.8)}
.btn.line{background:#fff;border:1px solid #DCE3DF;color:var(--e8);font-size:14px}
.seg{display:flex;background:#E9EEEB;border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border:0;border-radius:12px;font-size:13px;font-weight:800;background:transparent;color:var(--mut)}
.seg button.on{background:#fff;color:var(--e8);box-shadow:0 2px 6px rgba(15,50,40,.15)}
.money{display:flex;align-items:center;gap:8px;border:1px solid #DCE3DF;border-radius:14px;padding:0 14px;background:#FAFCFB}
.money:focus-within{border-color:var(--e6);box-shadow:0 0 0 4px rgba(18,128,95,.12)}
.money b{color:var(--mut)}
.money input{flex:1;min-width:0;border:0;background:transparent;padding:14px 0;font-size:18px;font-weight:700;outline:0;color:var(--ink)}
.lbl{font-size:13px;font-weight:700;color:#3A4A44}
.ico{display:grid;place-items:center;flex-shrink:0}
/* home */
.hero{position:relative;background:var(--e8);color:#fff;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 96px;overflow:hidden;border-radius:0 0 34px 34px}
.hero .sky{position:absolute;left:0;bottom:0;width:100%;height:90px}
.hero>*:not(.pat):not(.glow):not(.sky){position:relative}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:rgba(255,255,255,.1);padding:7px 11px;border-radius:99px}
.big{font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1.05}
.cd{font-size:18px;font-weight:800;color:var(--e8);background:var(--gold);padding:7px 12px;border-radius:12px;font-variant-numeric:tabular-nums}
.strip{position:relative;margin:-70px 16px 0;background:#fff;border-radius:24px;padding:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;box-shadow:0 18px 40px -18px rgba(6,47,36,.35);border:1px solid var(--line)}
.strip button{border:0;border-radius:16px;padding:10px 2px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px}
.strip button span{font-size:11px;font-weight:700;opacity:.85}.strip button b{font-size:14px}
.strip button.on{background:var(--e7);color:#fff}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.qgrid button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#22342D}
.qgrid i{width:58px;height:58px;border-radius:20px;display:grid;place-items:center}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.camp{flex-shrink:0;width:256px;overflow:hidden;scroll-snap-align:start}
.camp .top{position:relative;height:104px;overflow:hidden}
.tag{position:absolute;top:12px;left:12px;font-size:11px;font-weight:800;background:#fff;padding:4px 9px;border-radius:99px}
.prog{height:8px;background:#EEF2EF;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px}
.sbtn{border:0;background:var(--e7);color:#fff;padding:9px 14px;border-radius:11px;font-size:12px;font-weight:800;min-height:36px}
.row{display:flex;align-items:center;gap:14px}
.cal{width:58px;height:62px;flex-shrink:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cal b{font-size:22px;line-height:1}.cal span{font-size:11px;font-weight:800}
/* tabbar */
.tabbar{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));height:70px;background:#fff;border-radius:26px;border:1px solid var(--line);box-shadow:0 18px 40px -14px rgba(6,47,36,.35);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:10}
.tabbar button{border:0;background:transparent;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#6F7F79}
.tabbar button i{width:4px;height:4px;border-radius:50%;background:transparent}
.tabbar button.on{color:var(--e7);font-weight:800}
.tabbar button.on i{background:var(--gold)}
.tabbar .fab{justify-self:center;width:60px;height:60px;margin-top:-34px;border-radius:22px;border:5px solid var(--bg);background:var(--e7);color:var(--gold);box-shadow:0 14px 26px -10px rgba(15,90,69,.8)}
.toast{position:absolute;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;background:var(--e8);color:#fff;padding:13px 14px;border-radius:16px;font-size:13px;font-weight:600;box-shadow:0 16px 36px -10px rgba(6,47,36,.55);opacity:0;transform:translateY(12px);transition:.22s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:none}
.toast i{width:24px;height:24px;flex-shrink:0;border-radius:50%;background:var(--gold);color:var(--e8);display:grid;place-items:center}
/* lists */
.item{border:1px solid var(--line);background:#fff;border-radius:20px;padding:12px;display:flex;gap:14px;align-items:center;text-align:left;width:100%;box-shadow:var(--sh)}
.item .t{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.item .t b{font-size:15px}.item .t small{font-size:12px;color:var(--mut)}
.pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px}
.check{width:44px;height:44px;border-radius:50%;border:2px solid #AEBBB5;background:#fff;display:grid;place-items:center;color:#fff;flex-shrink:0}
.check.on{background:var(--e7);border-color:var(--e7)}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;border:2px solid var(--line);background:#fff;text-align:left;width:100%}
.opt.on{border-color:var(--e7)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #AEBBB5;display:grid;place-items:center;flex-shrink:0}
.opt.on .radio{border-color:var(--e7)}.opt.on .radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--e7)}
.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.amts button{min-height:52px;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:14px;font-weight:800}
.amts button.on{border-color:var(--e7);background:var(--e7);color:#fff}
.mchip{flex-shrink:0;width:132px;padding:12px;border-radius:18px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left}
.mchip.on{border-color:var(--e7);background:#F1F8F4}
.fchip{min-height:40px;padding:0 16px;border-radius:99px;border:1px solid #DCE3DF;background:#fff;font-size:13px;font-weight:800;color:#3A4A44}
.fchip.on{background:var(--e7);border-color:var(--e7);color:#fff}
.toggle{width:54px;height:32px;border-radius:99px;border:0;background:#AEBBB5;position:relative;padding:0}
.toggle::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.toggle[aria-pressed="true"]{background:var(--e7)}.toggle[aria-pressed="true"]::after{left:26px}
.star{position:relative;width:42px;height:42px;flex-shrink:0;color:var(--e7)}
.star svg{position:absolute;inset:0}.star span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800}
.kv{display:flex;justify-content:space-between;font-size:14px;gap:10px}.kv span{color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>

 },
 ztype:function(b){S.zType=b.dataset.v;S.zA=0;S.zB=0;render();},
 payZakat:function(){var inc=S.zType==='income',base=inc?S.zA+S.zB:Math.max(0,S.zA-S.zB),z=Math.round(base*.025);if(z<1000){toast('Isi nominal terlebih dahulu');return;}S.cat='Zakat';S.custom=z;go('donasi');},
 mf:function(b){S.mFilter=b.dataset.v;render();},
 openM:function(b){S.masjid=b.dataset.id;go('detail');},
 follow:function(){var m=curM(),f=!S.followed[m.id];S.followed[m.id]=f;save();render();toast(f?'Anda akan menerima kabar dari '+m.name:'Berhenti mengikuti '+m.name);},
 dir:function(){var m=curM();window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(m.name+' Tangerang Selatan'),'_blank','noopener');},
 share:function(){var m=curM(),u=location.href.split('#')[0];if(navigator.share)navigator.share({title:m.name,text:m.name+' di Kiblatku',url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){toast('Link disalin');});},
 pickM:function(b){S.masjid=b.dataset.id;render();},
 cat:function(b){S.cat=b.dataset.v;render();},
 amt:function(b){S.amount=+b.dataset.v;S.custom=0;render();},
 method:function(b){S.method=b.dataset.v;render();},
 pay:function(){var a=S.custom>0?S.custom:S.amount;if(a<10000){toast('Minimal donasi Rp 10.000');return;}var d=new Date();S.ref='ISL-'+String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())+'-'+String(Math.floor(1000+Math.random()*9000));S.donCount++;save();go('sukses');},
 shareR:function(){var a=S.custom>0?S.custom:S.amount,t='Alhamdulillah, saya berdonasi '+rp(a)+' ('+S.cat+') untuk '+curM().name+' lewat Kiblatku.';window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener');},
 checkin:function(){if(!S.checkedIn){S.checkedIn=true;render();toast('Kehadiran tercatat di Masjid Al-Ikhlas');}},
 join:function(b){var id=b.dataset.id,j=!S.joined[id];S.joined[id]=j;save();render();toast(j?'Terdaftar. Pengingat dikirim 1 jam sebelum acara.':'Pendaftaran dibatalkan');},
 openS:function(b){S.surah=+b.dataset.n;go('baca');},
 hist:function(){toast('Riwayat donasi lengkap tersedia di versi produksi');},
 hijri:function(){toast('Kalender Hijriah hadir di versi produksi');},
 notif:function(){S.notif=!S.notif;save();render();}
};
document.getElementById('screen').addEventListener('click',function(e){
 var g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}
 var a=e.target.closest('[data-act]');if(a&&A[a.dataset.act])A[a.dataset.act](a);
});
scroll.addEventListener('input',function(e){
 var k=e.target.dataset.in;if(!k)return;
 if(k==='q'){S.q=e.target.value;render();return;}
 var v=digits(e.target.value);S[k]=v;e.target.value=fmt(v);
 if(k==='custom'){render();return;}
 var inc=S.zType==='income',base=inc?S.zA+S.zB:Math.max(0,S.zA-S.zB);
 var z=scroll.querySelector('[data-z]'),zb=scroll.querySelector('[data-zb]');if(z)z.textContent=rp(base*.025);if(zb)zb.textContent='Dasar perhitungan: '+rp(base);
});
window.addEventListener('hashchange',function(){var s=location.hash.slice(1);if(V[s]&&s!==S.screen&&s!=='sukses'){S.screen=s;render();}});
var h=location.hash.slice(1);if(V[h]&&h!=='sukses'&&h!=='detail')S.screen=h;

var dev=document.querySelector('.device'),mq=window.matchMedia('(max-width:600px),(max-height:700px) and (max-width:900px)');
function fit(){if(mq.matches){dev.style.transform='';dev.style.margin='';return;}var k=Math.min(1,(window.innerHeight-40)/868);dev.style.transformOrigin='center center';dev.style.transform=k<1?'scale('+k+')':'';dev.style.margin=k<1?(-(868*(1-k))/2)+'px '+(-(414*(1-k))/2)+'px':'';}
window.addEventListener('resize',fit);fit();
var sp=document.getElementById('splash');var seen=false;try{seen=sessionStorage.getItem('kiblatku_splash');sessionStorage.setItem('kiblatku_splash','1');}catch(e){}
if(seen){sp.remove();}else{setTimeout(function(){sp.classList.add('hide');setTimeout(function(){sp.remove();},500);},1300);}
render();
})();
</script>
</body>
</html>
